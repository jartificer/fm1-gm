# SPDX-License-Identifier: GPL-3.0-only
# Host tests, then the device build (JieLi toolchain + AC79 SDK), then the host tests again with the
# package in place (the update-path tests). The .fwsc is uploaded as an artifact.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JIELI_TOOLCHAIN: ${{ github.workspace }}/.deps/jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/.deps/ac79-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Host tests
        run: tests/run_tests.sh
      - uses: actions/cache@v4
        with:
          path: .deps
          key: jieli-ac79-v1.2.1-2023-12-13-d179b448
      - name: Toolchain and SDK
        run: |
          if [ ! -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang" ]; then
            tools/get_toolchain.sh "$GITHUB_WORKSPACE/.deps/jieli"
          fi
          if [ ! -d "$AC79_SDK/.git" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          fi
          test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
      - name: Device build
        run: ./build.sh
      - name: Host tests with the package
        run: tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fm1gm-${{ github.sha }}
          path: |
            build/fm1gm.fwsc
            build/fm1gm.bin
            build/scenarios
